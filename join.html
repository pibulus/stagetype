<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/ghost.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff6e6">
<title>Join a talk · StageType</title>
<meta name="description" content="Enter a four-letter StageType code to read live captions right in the browser, tuned to any phone's own font, size, and theme.">
<meta property="og:type" content="website">
<meta property="og:title" content="Join a talk · StageType">
<meta property="og:description" content="Enter the four-letter room code to read live captions right in the browser and carry the notes home.">
<meta property="og:image" content="/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="/og-image.png">
<script src="/shared.js"></script>
<style>
  :root {
    --ground: #fff6e6; --surface: #fffdf5; --sand: #fdf1e0; --ink: #1e1714; --line: #1e1714;
    --pink: #ff6ac2; --mint: #2dd4bf; --butter: #ffc74d;
    --muted: #5a4b42;
    --swiss: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --mono: ui-monospace, Menlo, Consolas, monospace;
    --spring: cubic-bezier(.2, .9, .3, 1.35);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; min-height: 100%; background: var(--ground); color: var(--ink);
    font-family: var(--swiss); -webkit-font-smoothing: antialiased;
  }
  body {
    display: grid; place-items: center; min-height: 100dvh;
    background-image: radial-gradient(rgba(30, 23, 20, 0.08) 1.1px, transparent 1.3px);
    background-size: 22px 22px;
    padding: calc(env(safe-area-inset-top) + 24px) 18px calc(env(safe-area-inset-bottom) + 24px);
  }
  main { width: min(100%, 430px); display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
  .wordmark { font-size: 1.45rem; font-weight: 900; letter-spacing: -0.045em; text-decoration: none; color: var(--ink); }
  .wordmark::after { content: "."; color: var(--pink); }
  .join-card {
    width: 100%; background: var(--surface); border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--line);
    border-radius: 24px; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; align-items: center;
  }
  h1 { margin: 0; font-size: 2rem; letter-spacing: -0.04em; font-weight: 900; line-height: 1; }
  h1::after { content: "."; color: var(--pink); }
  p { margin: 0; color: var(--muted); font-weight: 600; font-size: 14.5px; line-height: 1.45; }
  .hint-note { font-size: 12.5px; color: var(--muted); }
  form { width: 100%; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  #code {
    width: 100%; text-align: center; text-transform: uppercase;
    font: 900 clamp(44px, 15vw, 62px)/1 var(--mono); letter-spacing: .26em; text-indent: .26em;
    color: var(--ink); background: var(--sand); border: 2px solid var(--line); box-shadow: 3px 3px 0 var(--line);
    border-radius: 18px; padding: 16px 8px; caret-color: var(--pink);
    transition: transform .16s var(--spring), box-shadow .16s var(--spring), background .16s;
  }
  #code::placeholder { color: rgba(30, 23, 20, 0.34); letter-spacing: .26em; }
  #code:focus { outline: 3px solid var(--ink); outline-offset: 3px; background: var(--surface); }
  #code.shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  button {
    font: 800 16px var(--swiss); color: var(--ink); background: var(--mint);
    border: 2px solid var(--line); box-shadow: 3px 3px 0 var(--line); border-radius: 999px;
    min-height: 50px; padding: 0 26px; width: 100%; cursor: pointer;
    transition: transform .18s var(--spring), box-shadow .18s var(--spring); -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) { button:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--line); } }
  button:active { transform: translate(1.5px, 1.5px) scale(.98); box-shadow: 1px 1px 0 var(--line); transition-duration: .06s; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 8px; }
  #err {
    width: 100%; color: var(--ink); font-weight: 700; font-size: 13.5px;
    background: var(--butter); border: 1.5px solid var(--line); box-shadow: 2px 2px 0 var(--line);
    border-radius: 14px; padding: 10px 14px;
  }
  #err:empty { position: absolute; width: 1px; height: 1px; padding: 0; border: 0; box-shadow: none; overflow: hidden; clip-path: inset(50%); }

  #saved { width: 100%; text-align: left; }
  #saved h2 { margin: 0 0 4px; font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .shelf-line { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  #savedList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  #savedList a {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; text-decoration: none; color: var(--ink);
    background: var(--surface); border: 2px solid var(--line); box-shadow: 3px 3px 0 var(--line);
    border-radius: 16px; padding: 13px 15px; transition: transform .18s var(--spring), box-shadow .18s var(--spring);
  }
  @media (hover: hover) { #savedList a:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--line); } }
  #savedList a:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--line); }
  #savedList b { font-size: 15px; font-weight: 800; }
  #savedList small { display: block; color: var(--muted); font-weight: 600; font-size: 12px; margin-top: 2px; }
  #savedList .live {
    font-size: 11px; font-weight: 800; letter-spacing: .04em; color: var(--ink);
    background: var(--mint); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 9px; white-space: nowrap;
  }
  #exportAll {
    margin-top: 12px; width: auto; min-height: 44px; padding: 0 18px;
    font-size: 13.5px; font-weight: 700; background: var(--surface); color: var(--ink);
  }
  footer { font-size: 13px; color: var(--muted); font-weight: 600; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px; }
  footer a { color: var(--ink); font-weight: 700; text-underline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; } }
</style>
</head>
<body>
<main>
  <a class="wordmark" href="/demo">StageType</a>
  <section class="join-card" aria-labelledby="joinHeading">
    <div>
      <h1 id="joinHeading">Join a talk</h1>
      <p style="margin-top:8px">Enter the four-letter code on screen to read along live.</p>
    </div>
    <form id="form" autocomplete="off">
      <input id="code" name="code" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false"
             maxlength="4" pattern="[A-Za-z]{4}" placeholder="ABCD" aria-label="Four-letter join code" aria-describedby="joinAutoHint" autofocus>
      <p id="joinAutoHint" class="hint-note">Jumps straight into the room on the fourth letter.</p>
      <p id="err" role="alert"></p>
      <button type="submit">Read along</button>
    </form>
  </section>
  <section id="saved" hidden>
    <h2>Saved on this phone</h2>
    <p class="shelf-line">Every talk saved on this phone. Tap any one to reopen, even offline.</p>
    <ul id="savedList"></ul>
    <button id="exportAll" type="button">Export all (.md)</button>
  </section>
  <footer>
    <span>Camera scan works on the stage QR too</span>
    <span aria-hidden="true">·</span>
    <a href="/demo">Live demo</a>
    <span aria-hidden="true">·</span>
    <a href="/">Stage Console</a>
  </footer>
</main>
<script>
const { store, download, prose, extractLinks } = window.StageTypeShared;
const code = document.querySelector("#code"), err = document.querySelector("#err"), form = document.querySelector("#form");
const params = new URLSearchParams(location.search);
const NOPE = "No talk is using that code right now. Check the screen and try again.";
if (params.get("nope")) { code.value = params.get("nope").toUpperCase(); err.textContent = NOPE; }
else if (params.get("code")) { code.value = params.get("code").toUpperCase(); }
let busy = false;
async function go(fromSubmit = false) {
  const c = code.value.trim().toUpperCase();
  if (busy) return;
  if (!/^[A-Z]{4}$/.test(c)) {
    if (fromSubmit) {
      err.textContent = "Enter the four-letter code on the screen.";
      code.classList.remove("shake"); void code.offsetWidth; code.classList.add("shake");
      code.focus();
    }
    return;
  }
  busy = true; err.textContent = "";
  try {
    const r = await fetch("/api/join/" + c);
    if (r.ok) { location.href = "/live/" + (await r.json()).id; return; }
    err.textContent = r.status === 404 ? NOPE : r.status === 429 ? "Lots of phones joining at once. Try again in a few seconds." : "Couldn't reach the relay. Try again in a moment.";
  } catch { err.textContent = "Couldn't reach the relay. Try again in a moment."; }
  code.classList.remove("shake"); void code.offsetWidth; code.classList.add("shake");
  if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
  busy = false;
}
form.onsubmit = (e) => { e.preventDefault(); go(true); };
code.oninput = () => { code.value = code.value.replace(/[^A-Za-z]/g, "").toUpperCase(); err.textContent = ""; if (code.value.length === 4) go(); };
if (code.value.length === 4 && !params.get("nope")) go();

// Talks saved on this phone, newest first. Each link reopens the reader offline or online.
const talks = store.json("stl-talks", []);
if (talks.length) {
  const list = document.querySelector("#savedList");
  for (const t of talks) {
    if (!t?.id) continue;
    const li = document.createElement("li");
    const a = document.createElement("a"); a.href = `/live/${t.id}`;
    const text = document.createElement("span");
    const b = document.createElement("b"); b.textContent = t.title || "Untitled talk";
    const small = document.createElement("small");
    small.textContent = [
      new Date(t.updatedAt || Date.now()).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }),
      `${t.words || 0} word${t.words === 1 ? "" : "s"}`,
      t.kept ? `${t.kept} kept` : "",
    ].filter(Boolean).join(" · ");
    text.append(b, small); a.append(text);
    if (!t.ended) { const tag = document.createElement("span"); tag.className = "live"; tag.textContent = "in progress"; a.append(tag); }
    li.append(a); list.append(li);
  }
  if (list.children.length) document.querySelector("#saved").hidden = false;

  document.querySelector("#exportAll").onclick = () => {
    const parts = [];
    for (const t of talks) {
      const rec = store.json(`stl-talk-${t.id}`, null);
      if (!rec?.lines?.length) continue;
      const when = new Date(rec.updatedAt || t.updatedAt || Date.now()).toLocaleDateString();
      const keptLines = (Array.isArray(rec.stars) ? rec.stars : []).map((i) => rec.lines[i]).filter(Boolean);
      const keptBlock = keptLines.length ? `## Kept\n\n${keptLines.map((k) => `> ${k}`).join("\n>\n")}\n\n` : "";
      const foundLinks = extractLinks(rec.lines, rec.links || []);
      const linkBlock = foundLinks.length ? `## Links\n\n${foundLinks.map((h) => `- ${h}`).join("\n")}\n\n` : "";
      parts.push(`# ${rec.title || "Untitled talk"}\n\n_${when} · ${t.words || 0} words · StageType_\n\n${keptBlock}${linkBlock}${prose(rec.lines, rec.times, rec.speakers, true)}`);
    }
    if (!parts.length) return;
    download(`stagetype-shelf-${new Date().toISOString().split("T")[0]}.md`, parts.join("\n\n---\n\n") + "\n", "text/markdown");
    const btn = document.querySelector("#exportAll");
    btn.textContent = "Saved";
    setTimeout(() => (btn.textContent = "Export all (.md)"), 1500);
  };
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
