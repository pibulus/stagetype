<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/ghost.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf1e4">
<title>StageType Live Reader</title>
<style>
  :root {
    --ground: #fbf1e4; --ink: #1e1714; --line: #3a2e28;
    --pill: #ffb3d1; --mint: #b8f0d8; --size: 22px;
    --muted: color-mix(in srgb, var(--ink) 55%, transparent);
    --swiss: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    --spring: cubic-bezier(.2, .9, .3, 1.35);
  }
  :root[data-theme="espresso"] { --ground: #1e1714; --ink: #fbf1e4; --line: #fbf1e4; }
  :root[data-theme="contrast"] { --ground: #fff0a8; --ink: #1e1714; --line: #1e1714; }
  :root[data-theme="night"]    { --ground: #1e1714; --ink: #fff0a8; --line: #fff0a8; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--swiss); -webkit-font-smoothing: antialiased;
  }
  body {
    background-image: radial-gradient(color-mix(in srgb, var(--ink) 9%, transparent) 1.1px, transparent 1.3px);
    background-size: 22px 22px;
  }
  ::selection { background: var(--pill); color: #1e1714; }
  
  header {
    position: sticky; top: 0; z-index: 10; background: var(--ground);
    padding: calc(env(safe-area-inset-top) + 12px) 18px 12px;
    display: flex; gap: 10px; align-items: center; border-bottom: 3px solid var(--line);
  }
  .live-badge {
    font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: 13px;
    margin-right: auto; display: flex; align-items: center; gap: 8px;
    padding: 6px 12px 6px 8px; border-radius: 999px; transition: background .25s;
  }
  #bar[data-state="live"] .live-badge { background: var(--mint); color: #1e1714; }
  #bar[data-state="ended"] .live-badge { background: var(--pill); color: #1e1714; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--muted); border: 2px solid var(--line);
  }
  #bar[data-state="live"] .dot { background: #51cf66; animation: breathe 1.6s ease-in-out infinite; }
  #bar[data-state="reconnecting"] .dot { background: #f4c45f; animation: breathe .9s ease-in-out infinite; }
  @keyframes breathe { 50% { background: var(--pill); transform: scale(1.15); } }

  .stats-pill {
    font-size: 12px; font-weight: 700; color: var(--muted);
    background: color-mix(in srgb, var(--line) 8%, transparent);
    padding: 4px 10px; border-radius: 999px; border: 1.5px solid var(--line);
  }

  button, summary {
    font: 800 15px var(--swiss); color: var(--ink); background: transparent;
    border: 2.5px solid var(--line); border-radius: 999px; min-width: 44px; height: 42px; padding: 0 14px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; list-style: none;
    box-shadow: 2px 2px 0 var(--line); transition: transform .22s var(--spring), box-shadow .22s var(--spring), background .15s;
    -webkit-tap-highlight-color: transparent;
  }
  button:active, summary:active { transform: translate(2px, 2px) scale(.96); box-shadow: none; transition-duration: .06s; }
  button:focus-visible, summary:focus-visible { outline: 3px solid var(--pill); outline-offset: 3px; }
  .swatch { transition: transform .22s var(--spring); }
  .swatch:hover { transform: scale(1.12) rotate(-6deg); }
  .swatch[aria-pressed="true"] { transform: scale(1.08); }
  summary::-webkit-details-marker { display: none; }
  summary::marker { display: none; }

  #panel { position: relative; }
  #panel[open] > summary { background: var(--pill); }
  .panel-body {
    position: absolute; top: calc(100% + 8px); right: 0;
    background: var(--ground); border: 3px solid var(--line); border-radius: 20px;
    box-shadow: 5px 5px 0 var(--line); padding: 18px;
    width: min(300px, calc(100vw - 32px));
    display: flex; flex-direction: column; gap: 14px; z-index: 20;
  }
  .panel-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .panel-label { width: 100%; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  #sizeLabel { font-weight: 700; font-size: 14px; min-width: 44px; text-align: center; }
  .swatches { display: flex; gap: 8px; }
  .swatch { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid var(--line); padding: 0; box-shadow: none; }
  .swatch[aria-pressed="true"] { outline: 3px solid var(--pill); outline-offset: 2px; }
  .swatch[data-t="cream"]    { background: linear-gradient(135deg, #fbf1e4 50%, #1e1714 50%); }
  .swatch[data-t="espresso"] { background: linear-gradient(135deg, #1e1714 50%, #fbf1e4 50%); }
  .swatch[data-t="contrast"] { background: linear-gradient(135deg, #fff0a8 50%, #1e1714 50%); }
  .swatch[data-t="night"]    { background: linear-gradient(135deg, #1e1714 50%, #fff0a8 50%); }
  .wide { width: 100%; justify-content: flex-start; }
  .wide[aria-pressed="true"] { background: var(--pill); color: #1e1714; }

  /* Feed Area */
  #feed { padding: 24px 20px 160px; font-size: var(--size); line-height: 1.5; max-width: 46em; margin: 0 auto; }
  #feed p { margin: 0 0 .75em; opacity: .78; transition: opacity .6s ease; }
  #feed p.fresh { opacity: 1; font-weight: 600; }
  #feed p.fresh span {
    background-image: linear-gradient(color-mix(in srgb, var(--pill) 55%, transparent), color-mix(in srgb, var(--pill) 55%, transparent));
    background-repeat: no-repeat; background-size: 0% 45%; background-position: 0 85%;
    animation: sweep 1.1s var(--spring) .1s forwards;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
  }
  #feed p.line-in { animation: lineIn .42s var(--spring); }
  @keyframes lineIn { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes sweep { to { background-size: 100% 45%; } }
  
  :root[data-loose="1"] #feed { line-height: 1.95; }
  :root[data-loose="1"] #feed p { letter-spacing: .025em; word-spacing: .16em; margin-bottom: 1.1em; }

  #interim {
    color: var(--ink); opacity: 1; border-radius: 8px; padding: 2px 6px; margin: -2px -6px;
    background: color-mix(in srgb, var(--pill) 35%, transparent); transition: background .2s ease;
  }
  #interim:empty { background: none; padding: 0; margin: 0; }
  #interim:not(:empty)::after {
    content: ""; display: inline-block; width: .1em; height: .85em; margin-left: .15em; vertical-align: -.08em;
    background: var(--ink); border-radius: 2px; animation: caret 1s steps(2) infinite;
  }
  @keyframes caret { to { opacity: 0; } }

  #waiting { text-align: center; padding: 48px 16px; }
  #waiting svg { color: var(--line); opacity: .55; animation: floatGhost 3.4s ease-in-out infinite; filter: drop-shadow(3px 3px 0 var(--pill)); }
  #waiting .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.08); } }
  #waiting p { margin-top: 14px; font-size: 16px; font-weight: 700; color: var(--muted); }
  #waiting p::after { content: "…"; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.6s steps(4) infinite; overflow: hidden; vertical-align: bottom; }
  @keyframes dots { from { width: 0; } to { width: 1.2em; } }
  @keyframes floatGhost { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  #jump {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%);
    background: var(--pill); color: #1e1714; border: 2.5px solid var(--line); box-shadow: 4px 4px 0 var(--line);
    height: 46px; padding: 0 24px; z-index: 15; font-weight: 800;
  }
  #jump[hidden] { display: none; }
  #jump { animation: popUp .4s var(--spring); }
  @keyframes popUp { from { transform: translate(-50%, 30px) scale(.8); opacity: 0; } }

  #endCard {
    margin: 12px 18px 32px; max-width: 46em; margin-inline: auto;
    background: var(--ground); border: 3px solid var(--line); border-radius: 22px;
    box-shadow: 6px 6px 0 var(--line); padding: 26px 24px;
  }
  #endCard[hidden] { display: none; }
  #endCard { position: relative; overflow: hidden; animation: cardIn .5s var(--spring); }
  @keyframes cardIn { from { transform: translateY(20px) rotate(-1deg) scale(.96); opacity: 0; } }
  #endCard h2 { margin: 0 0 6px; font-size: 24px; letter-spacing: -0.03em; font-weight: 900; }
  #endCard h2::after { content: "."; color: var(--pill); }
  .confetti { position: absolute; inset: 0; pointer-events: none; }
  .confetti i {
    position: absolute; top: -12px; width: 9px; height: 13px; border: 1.5px solid var(--line); border-radius: 2px;
    animation: fall var(--d, 2.2s) cubic-bezier(.3, .6, .6, 1) var(--w, 0s) both;
    left: var(--x); background: var(--c); transform: rotate(var(--r));
  }
  @keyframes fall { 0% { transform: translateY(0) rotate(var(--r)); opacity: 1; } 100% { transform: translateY(260px) rotate(calc(var(--r) + 300deg)); opacity: 0; } }
  #endCard p.sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.4; }
  #endCard .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  #endCard .actions button { flex: 1 1 130px; height: 46px; }

  footer {
    text-align: center; font-size: 13px; color: var(--muted);
    padding: 0 0 calc(env(safe-area-inset-bottom) + 24px); font-weight: 600;
  }
  footer a { color: inherit; text-decoration: underline; text-underline-offset: 3px; }

  /* Print Stylesheet: Beautiful Clean PDF / Paper Exports */
  @media print {
    header, #jump, #endCard .actions, footer, #panel, .stats-pill { display: none !important; }
    body, html { background: #fff !important; color: #111 !important; font-size: 12pt !important; line-height: 1.6 !important; }
    #feed { padding: 0 !important; max-width: 100% !important; font-size: 12pt !important; }
    #feed p { opacity: 1 !important; margin-bottom: 1em !important; page-break-inside: avoid; }
    #endCard { border: 1px solid #ccc !important; box-shadow: none !important; margin: 20px 0 !important; padding: 12px !important; }
    @page { margin: 20mm; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
      transition-duration: .001ms !important; scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<header id="bar" data-state="connecting">
  <span class="live-badge"><span class="dot"></span><span id="state">Connecting</span></span>
  <span class="stats-pill" id="statsPill">0 words</span>
  <details id="panel">
    <summary aria-label="Reading settings">Aa</summary>
    <div class="panel-body">
      <div class="panel-row">
        <span class="panel-label">Text size</span>
        <button id="smaller" aria-label="Smaller text">A−</button>
        <span id="sizeLabel">22px</span>
        <button id="bigger" aria-label="Bigger text">A+</button>
      </div>
      <div class="panel-row">
        <span class="panel-label">Theme</span>
        <div class="swatches">
          <button class="swatch" data-t="cream" aria-label="Cream theme"></button>
          <button class="swatch" data-t="espresso" aria-label="Espresso theme"></button>
          <button class="swatch" data-t="contrast" aria-label="High contrast theme"></button>
          <button class="swatch" data-t="night" aria-label="Night theme"></button>
        </div>
      </div>
      <button id="loose" class="wide" aria-pressed="false">Loose spacing</button>
      <button class="wide copy-btn">Copy transcript</button>
      <button class="wide" id="printBtn">Print or Save PDF</button>
    </div>
  </details>
</header>

<main id="feed" aria-live="polite">
  <div id="waiting">
    <svg viewBox="0 0 1024 1024" width="76" height="76" aria-hidden="true" focusable="false">

    <p>Waiting for the first spoken words</p>
  </div>
  <p id="interim" aria-live="off"></p>
</main>
<button id="jump" hidden>Jump to live</button>

<section id="endCard" role="status" hidden>
  <div class="confetti" aria-hidden="true"></div>
  <h2>That's a wrap</h2>
  <p class="sub">The transcript above stays readable. Take it along with you.</p>
  <div class="actions">
    <button class="copy-btn">Copy transcript</button>
    <button id="saveTxt">Save .txt</button>
    <button id="saveMd">Save .md</button>
    <button id="cardPrintBtn">Print / PDF</button>
  </div>
</section>

<footer>Captions by <a href="https://talktype.app">StageType</a> ♥ Part of the TalkType family</footer>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const roomId = location.pathname.split("/").pop();
const feed = $("#feed"), interimEl = $("#interim");
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
};

// Reader prefs survive between sessions
let size = Number(store.get("stl-size")) || 22;
let theme = store.get("stl-theme") || "cream";
let loose = store.get("stl-loose") === "1";
const themeColor = { cream: "#fbf1e4", espresso: "#1e1714", contrast: "#fff0a8", night: "#1e1714" };

function applyPrefs() {
  document.documentElement.style.setProperty("--size", size + "px");
  document.documentElement.dataset.theme = theme;
  document.documentElement.dataset.loose = loose ? "1" : "0";
  $('meta[name="theme-color"]').content = themeColor[theme];
  $("#sizeLabel").textContent = size + "px";
  $$(".swatch").forEach((s) => s.setAttribute("aria-pressed", String(s.dataset.t === theme)));
  $("#loose").setAttribute("aria-pressed", String(loose));
}
applyPrefs();

$("#bigger").onclick = () => { size = Math.min(56, size + 3); store.set("stl-size", size); applyPrefs(); };
$("#smaller").onclick = () => { size = Math.max(14, size - 3); store.set("stl-size", size); applyPrefs(); };
$$(".swatch").forEach((s) => s.onclick = () => { theme = s.dataset.t; store.set("stl-theme", theme); applyPrefs(); });
$("#loose").onclick = () => { loose = !loose; store.set("stl-loose", loose ? "1" : "0"); applyPrefs(); };

const atBottom = () => innerHeight + scrollY >= document.body.scrollHeight - 80;
let following = true;
addEventListener("scroll", () => {
  following = atBottom();
  $("#jump").hidden = following;
}, { passive: true });

$("#jump").onclick = () => {
  following = true;
  $("#jump").hidden = true;
  scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
};
const follow = () => { if (following) scrollTo({ top: document.body.scrollHeight }); };

const linesArr = [];
let totalWords = 0;

function updateStats() {
  const words = linesArr.reduce((acc, line) => acc + line.split(/\s+/).filter(Boolean).length, 0);
  totalWords = words;
  $("#statsPill").textContent = `${words} word${words === 1 ? "" : "s"}`;
}

function addLine(text, animate = true) {
  $("#waiting")?.remove();
  feed.querySelector("p.fresh")?.classList.remove("fresh");
  const p = document.createElement("p");
  p.className = animate ? "fresh line-in" : "fresh";
  const span = document.createElement("span");
  span.textContent = text;
  p.append(span);
  feed.insertBefore(p, interimEl);
  linesArr.push(text);
  updateStats();
}

const transcript = () => linesArr.join("\n\n");

async function copyTranscript(btn) {
  const orig = btn.textContent;
  try {
    await navigator.clipboard.writeText(transcript());
    btn.textContent = "Copied!";
    if (navigator.vibrate) navigator.vibrate(30);
  } catch {
    btn.textContent = "Blocked";
  }
  setTimeout(() => (btn.textContent = orig), 1500);
}
$$(".copy-btn").forEach((b) => b.onclick = () => copyTranscript(b));

function download(filename, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

$("#saveTxt").onclick = () => {
  const dateStr = new Date().toISOString().split("T")[0];
  download(`stagetype-${roomId}-${dateStr}.txt`, transcript(), "text/plain");
};

$("#saveMd").onclick = () => {
  const now = new Date();
  const dateStr = now.toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
  const frontmatter = `# StageType Live Transcript\n\n- **Date**: ${dateStr}\n- **Room**: \`${roomId}\`\n- **Words**: ${totalWords}\n\n---\n\n`;
  download(`stagetype-${roomId}-${now.toISOString().split("T")[0]}.md`, frontmatter + transcript() + "\n", "text/markdown");
};

const triggerPrint = () => window.print();
$("#printBtn").onclick = triggerPrint;
$("#cardPrintBtn").onclick = triggerPrint;

const setState = (state, label) => {
  $("#state").textContent = label;
  $("#bar").dataset.state = state;
};

const es = new EventSource(`/api/room/${roomId}/stream`);
let seen = 0;

es.addEventListener("open", () => setState("live", "Live"));

// `seen` is an absolute sequence number. The server trims old lines from its backlog and tells us
// how many it dropped (`offset`), so a reconnect after a long talk never double-prints or skips lines.
es.addEventListener("backlog", (e) => {
  const { lines, offset = 0 } = JSON.parse(e.data);
  lines.slice(Math.max(0, seen - offset)).forEach((t) => addLine(t, false));
  seen = Math.max(seen, offset + lines.length);
  follow();
});

es.addEventListener("final", (e) => {
  const { text } = JSON.parse(e.data);
  if (text) {
    addLine(text);
    seen++;
  }
  interimEl.textContent = "";
  follow();
});

es.addEventListener("interim", (e) => {
  interimEl.textContent = JSON.parse(e.data).text || "";
  follow();
});

function throwConfetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colours = ["#ffb3d1", "#b8f0d8", "#d9c8ff", "#fff0a8"];
  const box = $(".confetti");
  box.innerHTML = "";
  for (let i = 0; i < 26; i++) {
    const bit = document.createElement("i");
    bit.style.setProperty("--x", `${Math.random() * 100}%`);
    bit.style.setProperty("--c", colours[i % 4]);
    bit.style.setProperty("--r", `${Math.random() * 360}deg`);
    bit.style.setProperty("--d", `${1.8 + Math.random() * 1.4}s`);
    bit.style.setProperty("--w", `${Math.random() * 0.6}s`);
    box.append(bit);
  }
  setTimeout(() => (box.innerHTML = ""), 3500);
}

function talkOver(label) {
  es.close();
  interimEl.textContent = "";
  setState("ended", label);
  $("#jump").hidden = true;
  if (linesArr.length) {
    $("#endCard").hidden = false;
    throwConfetti();
    if (navigator.vibrate) navigator.vibrate([30, 80, 30]);
  }
}

es.addEventListener("end", () => talkOver("That's a wrap"));

es.onerror = () => {
  if (es.readyState === EventSource.CLOSED) {
    // The room is gone (ended while this phone was asleep, or the relay restarted). Whatever we
    // caught is still worth keeping, so offer the export card the same as a clean ending.
    talkOver("Room closed");
  } else {
    setState("reconnecting", "Reconnecting");
  }
};
</script>
</body>
</html>
