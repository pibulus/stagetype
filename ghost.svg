<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Stage Lights Gradient (Electric Mint to Cyber Cyan to Stage Violet to Hot Magenta) -->
    <linearGradient id="mascotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0"/>
      <stop offset="32%" stop-color="#00d9f5"/>
      <stop offset="70%" stop-color="#7b61ff"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background tile for icon display -->
  <rect width="1024" height="1024" rx="220" fill="#fbf1e4"/>

  <!-- Stage Lights Conical Beam & Ray Accents -->
  <g class="mascot-aura">
    <polygon points="512,180 180,940 844,940" fill="url(#mascotGrad)" opacity="0.18"/>
    <path d="M512 40 L512 85 M195 135 L235 175 M829 135 L789 175 M115 365 L165 375 M909 365 L859 375"
          stroke="#1e1714" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- Base Plate & Studio Yoke Mount (Behind Body) -->
  <g class="mascot-yoke" stroke="#1e1714" stroke-linecap="round" stroke-linejoin="round">
    <path d="M340 915 C340 890 380 880 512 880 C644 880 684 890 684 915 L684 935 C684 955 644 960 512 960 C380 960 340 955 340 935 Z"
          fill="#1e1714"/>
    <rect x="472" y="840" width="80" height="46" rx="8" fill="#1e1714"/>
    <path d="M190 515 C190 755 260 850 472 850 L552 850 C764 850 834 755 834 515"
          fill="none" stroke="#1e1714" stroke-width="40"/>
    <rect x="156" y="475" width="68" height="80" rx="20" fill="#1e1714"/>
    <circle cx="190" cy="515" r="14" fill="#fbf1e4"/>
    <rect x="800" y="475" width="68" height="80" rx="20" fill="#1e1714"/>
    <circle cx="834" cy="515" r="14" fill="#fbf1e4"/>
  </g>

  <!-- SOLID MASCOT SILHOUETTE (#mascot-background) -->
  <g id="mascot-background" class="mascot-fill">
    <path d="M462 145 C462 110 484 90 512 90 C540 90 562 110 562 145 Z" fill="url(#mascotGrad)"/>
    <path d="M260 380 C260 220 370 145 512 145 C654 145 764 220 764 380 L764 660 C764 770 654 815 512 815 C370 815 260 770 260 660 Z"
          fill="url(#mascotGrad)"/>
    <path d="M310 390 C310 265 400 205 512 205 C624 205 714 265 714 390 L714 550 C714 625 630 650 512 650 C394 650 310 625 310 550 Z"
          fill="url(#lensGlow)"/>
  </g>

  <!-- CHASSIS OUTLINE & RETRO BROADCAST HOUSING (#mascot-body-path) -->
  <g id="mascot-body-path" class="mascot-outline" stroke="#1e1714" stroke-linecap="round" stroke-linejoin="round">
    <path d="M458 150 C458 105 482 82 512 82 C542 82 566 105 566 150 Z"
          fill="none" stroke-width="24"/>
    <rect x="444" y="146" width="136" height="24" rx="10" fill="#1e1714" stroke="none"/>
    <path d="M260 380 C260 220 370 145 512 145 C654 145 764 220 764 380 L764 660 C764 770 654 815 512 815 C370 815 260 770 260 660 Z"
          fill="none" stroke-width="28"/>
    <path d="M310 390 C310 265 400 205 512 205 C624 205 714 265 714 390 L714 550 C714 625 630 650 512 650 C394 650 310 625 310 550 Z"
          fill="none" stroke-width="20" stroke-opacity="0.9"/>
    <g fill="#1e1714" stroke="none">
      <rect x="360" y="680" width="304" height="18" rx="9"/>
      <rect x="390" y="718" width="244" height="18" rx="9"/>
      <rect x="424" y="755" width="176" height="18" rx="9"/>
    </g>
    <circle cx="340" cy="465" r="22" fill="#ffb3d1" fill-opacity="0.4" stroke="none"/>
    <circle cx="684" cy="465" r="22" fill="#ffb3d1" fill-opacity="0.4" stroke="none"/>
    <path d="M472 525 C488 545 536 545 552 525"
          fill="none" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- LEFT EYE (#mascot-eye-left-path) -->
  <g id="mascot-eye-left-path" class="eye left" style="transform-box: fill-box; transform-origin: center;">
    <ellipse cx="414" cy="425" rx="38" ry="58" fill="#1e1714"/>
    <circle cx="426" cy="406" r="14" fill="#ffffff"/>
    <circle cx="400" cy="445" r="7" fill="#ffffff"/>
  </g>

  <!-- RIGHT EYE (#mascot-eye-right-path) -->
  <g id="mascot-eye-right-path" class="eye right" style="transform-box: fill-box; transform-origin: center;">
    <ellipse cx="610" cy="425" rx="38" ry="58" fill="#1e1714"/>
    <circle cx="622" cy="406" r="14" fill="#ffffff"/>
    <circle cx="596" cy="445" r="7" fill="#ffffff"/>
  </g>
</svg>
