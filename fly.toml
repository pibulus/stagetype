# fly launch --copy-config --no-deploy
# fly secrets set STAGETYPE_SECRET=$(openssl rand -hex 32)   # required: signs /demo room ids
# fly secrets set DEEPGRAM_API_KEY=dg_...                     # optional: the Deepgram engine
# fly secrets set STAGETYPE_DEEPGRAM_PASS=$(openssl rand -hex 16) # required if DEEPGRAM_API_KEY is set publicly
# fly deploy
# Full checklist: docs/DEPLOY.md
# One machine, never scaled to zero: rooms live in memory and a sleeping machine ends every talk.
app = "stagetype"
primary_region = "syd"

[build]

[env]
  PORT = "8787"
  HOST = "0.0.0.0"
  TRUST_PROXY = "fly"
  MAX_ASSET_RAM_MB = "128"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
